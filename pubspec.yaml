name: web_fetcher
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.1.0
repository: https://github.com/ThanCoder/web_fetch.git

environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_all: ^1.4.4
  dart_core_extensions:
    git: https://github.com/ThanCoder/dart_core_extensions.git
  t_widgets:
    git: https://github.com/ThanCoder/t_widgets.git
  t_client:
    git: https://github.com/ThanCoder/t_client
  than_pkg_linux: ^0.2.0
  than_pkg_android:
    git: https://github.com/ThanCoder/than_pkg_android.git
  cfb_store: ^0.8.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  change_app_package_name: ^1.5.0
  # dart run change_app_package_name:main [com.new.package.name]
  # dart run change_app_package_name:main than.app.webfetch
  flutter_launcher_icons: ^0.14.4
  # dart run flutter_launcher_icons

  # dev lib
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo/icon.png"

flutter:

  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
  - assets/logo/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
